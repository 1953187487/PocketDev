# android-ci 的 App 配置：所有工作流都从这里读设置，入口文件里只剩 uses: 和 secrets:。
# 只写你要改的键，其余用默认值。完整说明见 docs/android-ci.md（或 AGENTS.md）。

# 工程（必填：app.package）
workdir: .                          # app.json 所在目录，相对仓库根
app:
  package: com.pocketdev.app        # 必填：校验构建产物、发版核对
  display_name: PocketDev           # 填了会在发版时核对应用名

# 工具链：显式固定，便于复现。版本号加引号。
toolchain:
  node: '20'
  jdk: '17'
  expo: '54'                         # 与 package.json 的 expo 版本对齐（仅记录/缓存键）

build_test:
  typecheck_command: npx tsc --noEmit
  lint_command: npx expo lint
  test_command: npx jest
  pass_with_no_tests: true          # 没有测试用例时是否也算通过

build:
  prebuild_command: npx expo prebuild -p android --no-install
  gradle_command: ./gradlew assembleRelease
  gradle_flags: '--no-daemon --max-workers=2'
  apk_dir: android/app/build/outputs/apk/release   # 相对 workdir

release:
  artifact_prefix: pocketdev        # 产物名前缀，最终是 <prefix>-v<version>.apk
  marketing_version: ''             # 空则用 app.json 的 expo.version
  version_code: ''                  # 空则用 app.json 的 expo.android.versionCode
  acceptance_issue: false            # 上传成功后开“发版验收”Issue（入口文件要给 issues: write）
