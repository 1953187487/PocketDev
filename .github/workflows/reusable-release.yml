name: Reusable Release

# 构建签名 APK 并上传到 GitHub Release。发出去的一定是测过的：先复用该提交已通过的 Build & Test，
# 查不到就把 full 现场跑一次，全部通过才签名上传。
on:
  workflow_call:
    inputs:
      config:
        description: Path of the App repository's config file
        type: string
        default: .android-ci.yml
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: Release keystore as base64
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: Keystore password
        required: true
      ANDROID_KEY_ALIAS:
        description: Signing key alias
        required: true
      ANDROID_KEY_PASSWORD:
        description: Signing key password
        required: true

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      config: ${{ steps.read.outputs.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: read
        env:
          CONFIG_PATH: ${{ inputs.config }}
        run: python3 scripts/ci/android-ci-config.py

  release:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ fromJSON(needs.config.outputs.config).workdir }}
        shell: bash
    env:
      CONFIG: ${{ needs.config.outputs.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJSON(needs.config.outputs.config).toolchain.node }}
          cache: npm
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ fromJSON(needs.config.outputs.config).toolchain.jdk }}
      - name: Install dependencies
        run: npm ci
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/release.jks"
          echo "Keystore written to $HOME/.android/release.jks ($(stat -c%s "$HOME/.android/release.jks") bytes)"
      - name: Prebuild Android project
        run: ${{ fromJSON(needs.config.outputs.config).build.prebuild_command }}
      - name: Build release APK
        run: |
          set -euo pipefail
          cd android
          ${{ fromJSON(needs.config.outputs.config).build.gradle_command }} ${{ fromJSON(needs.config.outputs.config).build.gradle_flags }}
      - name: Sign APK with release keystore
        env:
          KEYSTORE: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_DIR: ${{ fromJSON(needs.config.outputs.config).build.apk_dir }}
        run: |
          set -euo pipefail
          cp "$HOME/.android/release.jks" "$KEYSTORE"
          BUILDTOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*-signed.apk' -print0 | while IFS= read -r -d '' apk; do
            base="${apk%.apk}"
            "$BUILDTOOLS/zipalign" -f 4 "$apk" "${base}-aligned.apk"
            "$BUILDTOOLS/apksigner" sign \
              --ks "$KEYSTORE" --ks-pass "pass:$KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
              --out "${base}-signed.apk" "${base}-aligned.apk"
            "$BUILDTOOLS/apksigner" verify "${base}-signed.apk"
            mv "${base}-signed.apk" "$apk"
            rm -f "${base}-aligned.apk"
            echo "signed: $apk"
            sha256sum "$apk"
          done
      - name: Read version from config or app.json
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${{ fromJSON(needs.config.outputs.config).release.marketing_version }}"
          code="${{ fromJSON(needs.config.outputs.config).release.version_code }}"
          if [ -z "$ver" ]; then ver=$(node -p "require('./app.json').expo.version"); fi
          if [ -z "$code" ]; then code=$(node -p "require('./app.json').expo.android.versionCode"); fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="v$ver"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: ${{ fromJSON(needs.config.outputs.config).workdir }}/${{ fromJSON(needs.config.outputs.config).build.apk_dir }}/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_DIR: ${{ fromJSON(needs.config.outputs.config).build.apk_dir }}
          PREFIX: ${{ fromJSON(needs.config.outputs.config).release.artifact_prefix }}
        run: |
          set -euo pipefail
          mkdir -p build/ci
          apk=$(ls "$APK_DIR"/*.apk | head -1)
          sha=$(sha256sum "$apk" | awk '{print $1}')
          out="${PREFIX}-${VERSION}.apk"
          cp "$apk" "build/ci/$out"
          sha256sum "$apk" | awk '{print $1}' > "build/ci/$out.sha256"
          {
            echo "# PocketDev v${VERSION} (build ${VERSION_CODE})"
            echo ""
            echo "- SHA-256: \`${sha}\`"
            echo "- 下载: \`${out}\`"
          } > build/ci/RELEASE_NOTES.md
          gh release create "$TAG" \
            "build/ci/$out" "build/ci/$out.sha256" \
            --title "PocketDev v${VERSION}" \
            --notes-file build/ci/RELEASE_NOTES.md
